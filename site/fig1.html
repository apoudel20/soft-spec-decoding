<figcaption><b>Figure 1.</b> The proposal in one picture. Both trees spend the same 9-node draft budget on the GSM8K-style prefix "…in May she sold". In (a) the drafter grows branches by its own confidence, and everything off the verified path is discarded. In (b) a gist read from the target's middle layers rules out a branch before any drafting, spends the saved budget one step deeper on the likely branch, and keeps an unchosen branch in the KV cache for later rounds. This is an illustration of the idea, not a measured result.</figcaption>
